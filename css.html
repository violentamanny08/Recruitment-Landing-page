<style>
  #hp-loader{position:fixed;inset:0;z-index:99999;background:linear-gradient(135deg,#031a3f,#062b67 70%,#0b3c78);display:flex;align-items:center;justify-content:center;transition:opacity .5s ease,visibility .5s ease;animation:hpfallback 0s linear 6s forwards}
#hp-loader.hide{opacity:0;visibility:hidden}
.hp-box{text-align:center;padding:24px}
.hp-logo{width:84px;height:84px;border-radius:50%;margin:0 auto 14px;box-shadow:0 0 0 4px rgba(255,107,0,.9)}
.hp-brand{font:800 24px 'Bricolage Grotesque',Georgia,sans-serif;color:#fff}
.hp-sub{font:500 13px Figtree,system-ui,sans-serif;color:#cfe0f5;margin-top:6px}
.hp-ring{width:34px;height:34px;margin:22px auto 0;border-radius:50%;border:4px solid rgba(255,255,255,.18);border-top-color:#ff6b00;animation:hpspin 1s linear infinite}
.hp-bar{width:180px;height:4px;background:rgba(255,255,255,.18);border-radius:4px;margin:18px auto 0;overflow:hidden}
.hp-bar span{display:block;height:100%;width:0;background:#ff6b00;animation:hpfill 1.8s ease forwards}

@keyframes hpfill{to{width:100%}}
@keyframes hpfallback{to{opacity:0;visibility:hidden}}
:root{--bg:#f5f8fc;--ink:#062b67;--mute:#4d6278;--acc:#ff6b00;--teal:#15803d;--soft:#e6eef8;--card:#fff;--tint:linear-gradient(180deg,#e6eef8,#fff1e6);--line:#cbd7e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--tint:linear-gradient(180deg,#12283d,#1c2433);--bg:#0b1a2b;--ink:#eef3f1;--mute:#a9bccb;--soft:#12283d;--card:#10243a;--line:#2a445c}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--tint:linear-gradient(180deg,#12283d,#1c2433);--bg:#0b1a2b;--ink:#eef3f1;--mute:#a9bccb;--soft:#12283d;--card:#10243a;--line:#2a445c}
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',Georgia,sans-serif;line-height:1.1;margin:0}
.w{max-width:1080px;margin:0 auto;padding:0 22px}
section{padding:72px 0}
h2{font-size:clamp(28px,4vw,40px);margin-bottom:12px;font-weight:800}
.lead{color:var(--mute);max-width:56ch;margin:0 0 32px}

.brand{font:800 19px 'Bricolage Grotesque',sans-serif}

.btn:hover{filter:brightness(1.06)}
.btn.line{background:none;border:1.5px solid var(--ink);color:var(--ink)}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.hero{padding:36px 0 84px;display:grid;grid-template-columns:1fr 1.15fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(40px,6.4vw,68px);font-weight:800;letter-spacing:-.02em}

.duo{position:relative;height:340px}

.pc span{font-size:15px;opacity:.9}
.pc.m{background:var(--ink);left:0;top:50px}
.pc.a{background:var(--teal);right:0;top:0}

.strip{background:var(--acc);color:#031a3f;font-weight:700}

.people{display:grid;grid-template-columns:1fr 1fr;gap:24px}

.ph{border:1.5px dashed var(--line);border-radius:12px;padding:12px 14px;color:var(--mute);font-size:15px;margin-top:10px}
.story{background:linear-gradient(135deg,#031a3f 0%,#062b67 70%,#0b3c78 100%);color:#fff}

.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:3px solid var(--acc)}
.grid4>div{padding:22px 20px 0 0}
.grid4 h3{font-size:20px;color:var(--teal);margin-bottom:6px}
.grid4 p{margin:0;color:var(--mute);font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:40px}
ul.ck{list-style:none;padding:0;margin:0}
ul.ck li{padding:13px 0 13px 34px;border-bottom:1px solid var(--line);position:relative}
ul.ck li:before{content:"";position:absolute;left:4px;top:19px;width:14px;height:8px;border-left:3px solid var(--teal);border-bottom:3px solid var(--teal);transform:rotate(-45deg)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;counter-reset:s}
.s3{grid-template-columns:repeat(3,1fr)}
.sticky{display:none}
.steps div{border-left:3px solid var(--teal);padding-left:16px;counter-increment:s}

.steps b{display:block}
.steps span{color:var(--mute);font-size:16px}
details{border-bottom:1px solid var(--line);padding:16px 0;max-width:760px}
summary{font:700 19px 'Bricolage Grotesque',sans-serif;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
summary:after{content:"+";color:var(--teal);font-size:24px;line-height:1}

.cta{background:linear-gradient(135deg,#031a3f,#062b67);color:#fff;text-align:center}
.cta h2{color:#fff}
.cta p{margin:0 0 24px;opacity:.92}

dialog::backdrop{background:rgba(6,16,28,.7)}
.mb{padding:26px}
.bar{height:6px;background:var(--soft);border-radius:9px;overflow:hidden;margin:0 0 6px}
.bar i{display:block;height:100%;width:0;background:var(--teal);transition:width .3s}
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mute);margin-bottom:14px}
.x{background:none;border:0;font-size:26px;cursor:pointer;color:var(--ink)}
.opt{display:block;width:100%;text-align:left;margin:10px 0;padding:15px 16px;background:var(--card);border:1px solid var(--line);border-radius:12px;font:500 16px Figtree,sans-serif;color:var(--ink);cursor:pointer}
.opt:hover{border-color:var(--teal)}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
input[type=text],input[type=tel],input[type=email]{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:16px Figtree,sans-serif;background:var(--card);color:var(--ink)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.small{font-size:13px;color:var(--mute);margin:14px 0}
.err{color:#b3261e;font-size:14px;min-height:20px}
@media(max-width:820px){.hero,.two,.people{grid-template-columns:1fr}
.grid4,.steps,.s3{grid-template-columns:1fr 1fr}
.duo{height:320px;max-width:420px}

}
@media(max-width:480px){.grid4,.steps,.s3,.fg{grid-template-columns:1fr}
.sticky{display:block;position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);text-align:center;z-index:5}
.sticky .btn{width:100%}
footer{padding-bottom:90px}
.pc{width:170px;height:230px}
.pc b{font-size:48px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}
}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.vid{aspect-ratio:16/9;max-width:760px;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}
.pic{aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;text-align:center;margin:0 0 16px}
.soc{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:0 0 14px}
.soc a{color:#fff;border:1.5px solid #fff;border-radius:999px;padding:8px 18px;text-decoration:none;font-weight:600;font-size:15px}
.note{font-size:13px;color:var(--mute);max-width:70ch;margin-top:18px}
@media(max-width:820px){.stats{grid-template-columns:1fr}
}
.herotop{background:linear-gradient(135deg,#031a3f 0%,#062b67 60%,#0b3c78 100%);color:#fff}
.herotop .brand{display:flex;align-items:center;gap:10px}
.logo{width:42px;height:42px;border-radius:50%}
.herotop .hero p{color:#cfe0f5}
.herotop .btn.line{color:#fff;border-color:#fff}
.heroimg{position:relative;padding-bottom:64px}
.heroimg img{width:100%;display:block;border-radius:24px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
.pcard .pic{aspect-ratio:4/5;padding:0;border:0;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;border-radius:12px}
.st{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:12px;padding:16px 18px}
.st b{display:block;font:700 18px 'Bricolage Grotesque',sans-serif}
.st span{color:var(--mute);font-size:15px}
.wide{width:100%;border-radius:16px;margin-top:22px;display:block}
h2:after{content:"";display:block;width:56px;height:5px;background:var(--acc);border-radius:3px;margin-top:10px}
.cta h2:after{margin:10px auto 0}
.story .lead,.story .steps span{color:#cfe0f5}
.story .ck li{border-color:rgba(255,255,255,.2)}

.story .ph{border-color:rgba(255,255,255,.45);color:#cfe0f5}

.story .steps div:before{color:var(--acc)}
.tri{height:6px;background:linear-gradient(90deg,#062b67 0 34%,#ff6b00 34% 67%,#16a34a 67%)}

.herotop .hero p.cap{position:absolute;left:0;right:0;bottom:4px;margin:0;max-width:none;font-size:13px;color:#cfe0f5;text-align:center}
.herotop{position:relative;overflow:hidden}.herotop .w{position:relative;z-index:2}
.herotop .hero{display:block;max-width:540px;padding:36px 0 96px}.herotop .hero h1{font-size:clamp(38px,5vw,60px)}
.herotop .heroimg{position:absolute;top:0;right:0;bottom:0;width:62%;padding:0;z-index:1}
.herotop .heroimg img{width:100%;height:100%;object-fit:cover;object-position:right 15%;border:0;border-radius:0;box-shadow:none;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 40%);mask-image:linear-gradient(90deg,transparent 0,#000 40%)}
.badge{position:absolute;right:max(22px,calc((100vw - 1080px)/2));bottom:24px;max-width:330px;background:rgba(3,26,63,.74);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.18);border-left:4px solid var(--acc);border-radius:14px;padding:12px 16px;color:#fff;font-size:12.5px;line-height:1.45}
.badge b{display:block;font:700 15px 'Bricolage Grotesque',sans-serif;margin-bottom:2px}.badge span{color:#cfe0f5}
@media(max-width:820px){.herotop .hero{padding-bottom:24px;max-width:none}.herotop .heroimg{position:relative;width:100%;height:auto;margin-top:8px}.herotop .heroimg img{height:auto;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 22%);mask-image:linear-gradient(180deg,transparent 0,#000 22%)}.badge{position:relative;right:auto;bottom:auto;max-width:none;margin:-18px 22px 22px}}
@media(max-width:820px){.herotop{display:flex;flex-direction:column}.herotop .w{order:1;width:100%}.herotop .heroimg{order:2}}
.pain{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.pn{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:14px;padding:20px 20px 18px}
.pn q{display:block;quotes:none;font:700 19px/1.3 'Bricolage Grotesque',sans-serif;color:var(--ink);margin-bottom:12px}
.pn small{display:block;color:var(--teal);font-weight:700;font-size:13px;margin-bottom:4px}.pn p{margin:0;color:var(--mute);font-size:15.5px}
@media(max-width:820px){.pain{grid-template-columns:1fr 1fr}}@media(max-width:560px){.pain{grid-template-columns:1fr}}

/* Centered proof point and mentorship value within the mentor section */
.license-panel{max-width:820px;margin:42px auto 0;padding:30px 32px;text-align:center;background:linear-gradient(135deg,#eef4fb 0%,#fff 100%);border:1px solid var(--line);border-radius:20px}
.license-panel h2{font-size:clamp(22px,3vw,28px);margin:0 0 10px;color:var(--ink)}

</style>
